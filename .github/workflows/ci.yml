name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tova

jobs:
  verify:
    name: check · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node, which needs pnpm on PATH to resolve its cache.
      # The version comes from the packageManager field, so it lives in one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tova/package.json

      - uses: actions/setup-node@v4
        with:
          # Matches local development; CI should reproduce the dev environment
          # rather than a version nobody builds on.
          node-version: 25
          cache: pnpm
          cache-dependency-path: tova/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each step is separate so a red run names which gate failed.
      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
