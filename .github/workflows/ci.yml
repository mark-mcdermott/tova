name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node, which needs pnpm on PATH to resolve its cache.
      # The version comes from the packageManager field, so it lives in one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          # Matches local development; CI should reproduce the dev environment
          # rather than a version nobody builds on.
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each step is separate so a red run names which gate failed.
      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # The backend being ported into. Its own job: it shares no toolchain with the
  # one above, and a red run should name which side of the port broke.
  #
  # On Linux, where the runner is a tenth the price of a macOS one. The logic
  # here is platform-independent and that is what the tests cover; anything
  # macOS-only is behind a cfg and is compiled locally and by whatever builds
  # the bundle. Which means this job will not catch a macOS-only compile error
  # — it is the reverse case it catches, and it has already earned its keep
  # doing that.
  rust:
    name: cargo fmt · clippy · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri needs system webkit to build on Linux. Only the library is
      # compiled here — the app is built and shipped on macOS.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
