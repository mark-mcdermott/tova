<!doctype html>
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    width: 1024px;
    height: 1024px;
    background: transparent;
  }

  /*
   * macOS icons sit in a rounded square inside a margin of their own — the
   * system does not add one, and an icon that fills its canvas reads a size
   * larger than every neighbour in the dock. 824px of art in a 1024px canvas
   * is the Big Sur proportion.
   *
   * The artwork already carries its own rounded corners, so nothing is masked
   * here; this only places and scales it.
   */
  img {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 824px;
    height: 824px;
    /* The source is square in intent but exports a pixel or two off; letting
       it fill corrects that rather than letterboxing a visible seam. */
    object-fit: fill;
    image-rendering: auto;
  }
</style>

<img src="../../branding/icons/app-icon.png" alt="" />
