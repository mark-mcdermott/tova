appId: io.markmcdermott.tova
productName: Tova
copyright: © Mark McDermott

directories:
  buildResources: build
  output: release

# electron-vite has already bundled everything into out/, so the app ships that
# and the manifest — never src/, and never the dependency tree it compiled away.
#
# The exclusion is not redundant: `files` adds to electron-builder's default,
# which packs production node_modules whole. Left in, the asar was 104MB against
# 19MB of real build output, and carried harper's WASM three times — the copy the
# renderer loads, plus the slim and full models still sitting in node_modules.
# Nothing reads from there at runtime; the bundler resolved those imports at
# build time.
files:
  - out/**
  - package.json
  - "!node_modules/**"

# The vault lives in ~/Documents, so nothing about the user's notes is packaged
# with the app and nothing is written inside the bundle.
asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Electron ships 220 .lproj bundles — 48MB of Chromium's own interface strings
  # in every language it has ever been translated into. Tova's interface is in
  # one, and nothing here asks Chromium for its menus in another.
  electronLanguages:
    - en
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Both are required before notarization will accept the build. They cost
  # nothing on an unsigned build, so they stay on rather than being remembered
  # later.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: © Mark McDermott

dmg:
  title: Tova ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
