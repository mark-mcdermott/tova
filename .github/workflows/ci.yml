name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so the badge means "still green today" rather than "was green on
    # the last push". Offset off the hour — GitHub delays on-the-hour crons.
    - cron: "17 6 * * *"

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node, which needs pnpm on PATH to resolve its cache.
      # The version comes from packageManager in package.json, so it lives in
      # one place.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      # Node major is pinned — an unpinned toolchain rots CI with no commit to
      # blame. 25 matches local development.
      - uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a red run names which gate failed.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # The backend being ported into. Its own job: it shares no toolchain with the
  # one above, and a red run should name which side of the port broke.
  #
  # On Linux, where the runner is a tenth the price of a macOS one. The logic
  # here is platform-independent and that is what the tests cover; anything
  # macOS-only is behind a cfg and is compiled locally and by whatever builds
  # the bundle. Which means this job will not catch a macOS-only compile error
  # — it is the reverse case it catches, and it has already earned its keep
  # doing that.
  rust:
    name: cargo fmt · clippy · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri needs system webkit to build on Linux. Only the library is
      # compiled here — the app is built and shipped on macOS.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
