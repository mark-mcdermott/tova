<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Alagambe";
    src: url("../src/renderer/assets/fonts/alagambe.otf") format("opentype");
  }

  html,
  body {
    margin: 0;
    width: 1024px;
    height: 1024px;
    background: transparent;
  }

  /*
   * macOS icons sit in a rounded square inside a margin of their own — the
   * system does not add one. 824px of art in a 1024px canvas is the Big Sur
   * proportion.
   */
  .icon {
    position: absolute;
    inset: 100px;
    border-radius: 185px;
    overflow: hidden;
    background:
      radial-gradient(120% 100% at 72% 30%, #ffd9a8 0%, transparent 55%),
      radial-gradient(120% 90% at 20% 12%, #b9b3cc 0%, transparent 60%),
      linear-gradient(168deg, #d6d0e2 0%, #c9bcd4 42%, #8f96b4 100%);
  }

  /* The sun, low and warm, as it sits in the app's own backdrop. */
  .sun {
    position: absolute;
    left: 76%;
    top: 40%;
    width: 210px;
    height: 210px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #fff6e2 0%, #ffd9a0 42%, rgb(255 200 130 / 0%) 72%);
  }

  /* Water: a flat band with a soft horizon, not a drawn shoreline. */
  .water {
    position: absolute;
    inset: auto 0 0 0;
    height: 42%;
    /* A horizon that dissolves rather than a drawn line. */
    background: linear-gradient(
      180deg,
      rgb(126 134 166 / 0%) 0%,
      rgb(126 134 166 / 62%) 14%,
      #6a7196 100%
    );
  }

  .wordmark {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: "Alagambe", cursive;
    font-size: 430px;
    line-height: 1;
    /* Optical centring: the script T hangs high on its own line box. */
    padding-top: 40px;
    color: #ffffff;
    text-shadow: 0 10px 40px rgb(40 32 60 / 45%);
  }
</style>
<div class="icon">
  <div class="sun"></div>
  <div class="water"></div>
  <div class="wordmark">T</div>
</div>
