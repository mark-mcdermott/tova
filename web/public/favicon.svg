<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 170 185">
  <!--
    Tova's t, which is the first path of the wordmark in
    src/renderer/components/Sidebar/Wordmark.tsx — the same outlines, not a
    second drawing of them. The viewBox crops to the letter and lets its tail
    run off the edge: the whole mark is 262 wide against 169 tall, and squeezed
    into a square it is a thin grey smudge at the size a tab actually shows.

    Two inks rather than one. A favicon sits on the browser's own chrome, which
    is pale in one theme and dark in the other, and a single colour loses
    against one of them. `prefers-color-scheme` is honoured inside an SVG
    favicon, so this is the rare place a tab icon can follow the reader.

    fill-rule is evenodd for the reason the wordmark gives: the export drew the
    counters twice, and white is only a hole over white.
  -->
  <style>
    path { fill: #17141f }
    @media (prefers-color-scheme: dark) { path { fill: #f3f0f9 } }
  </style>
