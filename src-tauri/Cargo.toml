[package]
name = "tova"
version = "1.0.0"
edition = "2021"
description = "Tova — a calm local-first writing app"
authors = ["Mark McDermott"]
# The Electron main process is still the one that ships. This builds beside it
# and is ported into, module by module, behind the same IPC surface.
publish = false

[lib]
name = "tova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
base64 = "0.22"
aes-gcm = "0.11"
scrypt = "0.12"
getrandom = "0.3"
cbc = { version = "0.2", default-features = false, features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.13", default-features = false }
sha1 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
aes = { version = "0.9", default-features = false }
unicode-normalization = "0.1"
chrono = "0.4"
tauri-plugin-opener = "2"
url = "2"
http = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
ureq = "3"
tauri-plugin-updater = "2.11.0"

# Only the keychain needs it, and only Electron's safeStorage format on macOS
# has a keychain to read. Gated here rather than in the code alone so a Linux
# build — which is what CI compiles — does not pull it in at all.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKPDFConfiguration", "WKWebView", "block2"] }
security-framework = "3"

[profile.release]
# A binary measured against a 241MB Electron bundle is worth a minute of LTO.
lto = true
codegen-units = 1
strip = true
